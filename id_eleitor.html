<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página do Mesário</title>
    <script
      src="https://kit.fontawesome.com/877e197de7.js"
      crossorigin="anonymous"
    ></script>
    <script src="constantes.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="mainMesario.js"></script>
    <style>
      .shadow-custom {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .fa-bars {
        font-size: 150%;
        cursor: pointer;
        color: black;
        position: absolute;
        top: 2%;
        left: 2%;
        z-index: 10;
      }

      .nv_est {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 17%;
        height: 75%;
        background-color: var(--branco);
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
        z-index: 9;
        padding: 2%;
        transition: background-color 0.3s;
      }

      .nv_est a {
        font-family: "Roboto", sans-serif;
        text-transform: uppercase;
        text-decoration: none;
        color: black;
        padding: 7%;
        margin-top: 7%;
        border-bottom: 1px solid #ccc;
        border-bottom: none;
      }

      .nv_est a:hover {
        background-color: #f0f0f0;
      }
    </style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <nav>
      <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
      <div class="nv_est" id="menuItems">
        <a href="hub.html">Home</a>
        <a href="hub_chapas.html">Gerenciador de Candidatos</a>
        <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
        <a href="contagem.html">Contagem de Votos</a>
        <a href="id_eleitor.html">Iniciar Processo</a>
        <a href="index.html">Sair</a>
      </div>
    </nav>

    <button
      id="md_es"
      class="absolute bottom-6 bg-black text-gray-300 px-5 py-3 rounded-lg font-semibold text-lg"
      onclick="mod_esc()"
    >
      Modo Escuro
    </button>

    <div class="container mx-auto p-4">
      <div
        class="bg-gray-300 rounded-lg shadow-lg p-6 max-w-lg mx-auto relative min-h-[400px] flex flex-col items-center justify-center"
      >
        <button
          id="voltarHub"
          class="botao bg-red-500 text-white py-2 px-4 rounded-full hover:bg-red-600 transition absolute top-4 right-4"
          onclick="voltarHub()"
          title="Página anterior"
        >
          <i class="fa-solid fa-circle-chevron-left"></i> Voltar
        </button>

        <div class="text-center mb-4">
          <h1 class="text-2xl font-semibold mb-2">Processo de Votação</h1>
          <h2 class="text-gray-700 mb-4">
            Digite o RA do eleitor para buscar seu registro e autorizar a
            votação.
          </h2>
        </div>

        <div class="flex flex-col items-center">
          <p id="mensagem" class="font-bold text-center mb-4"></p>
          <div id="eleitores" class="mb-4 w-full flex justify-center">
            <div
              class="border border-gray-300 rounded-lg p-4 w-full max-w-xs hidden"
              id="eleitoresContainer"
            ></div>
          </div>
          <input
            type="search"
            name="ra"
            id="ra"
            placeholder="RA do eleitor"
            autofocus
            class="border border-gray-300 rounded-lg p-3 w-full max-w-md text-center mb-2"
            maxlength="4"
          />
          <button
            class="botao buscarBTN bg-blue-600 text-white py-3 px-6 rounded-lg mb-2 hover:bg-blue-700 transition w-full max-w-md"
            id="buscarBTN"
            onclick="buscarEleitores()"
            title="Consultar eleitor"
          >
            <i class="fa-solid fa-magnifying-glass"></i> Buscar
          </button>
        </div>
      </div>
    </div>

    <script>
      function toggleMenu() {
        const menu = document.getElementById("menuItems");
        menu.classList.toggle("menu-opened");
      }
      document.querySelector(".fa-bars").addEventListener("click", function () {
        document.body.classList.toggle("menu-opened");
      });

      var input = document.getElementById("ra");
      input.addEventListener("keyup", function (event) {
        if (event.keyCode === 13) {
          event.preventDefault();
          document.getElementById("buscarBTN").click();
        }
      });

      function buscarEleitores() {
        const ra = document.getElementById("ra").value;
        fetch(`${BaseUrl}/eleitor/${ra}`)
          .then((response) => response.json())
          .then((eleitor) => {
            const eleitorRA = eleitor.ra;

            const eleitoresContainer =
              document.getElementById("eleitoresContainer");
            if (typeof eleitorRA != "undefined") {
              eleitoresContainer.innerHTML = `
              <section class="liberarVoto p-4 border border-black rounded-lg mb-4">
                <p>RA: ${eleitor.ra}, Nome: ${eleitor.nome}</p>
                <button class="botao bg-green-500 text-white py-1 px-2 rounded-lg mt-2 hover:bg-green-600 transition" id="liberarBTN" onclick="liberarEleitor('${eleitor.ra}')">Liberar Voto</button>
              </section>
            `;
              eleitoresContainer.classList.remove("hidden"); // Remove a classe hidden
              eleitoresContainer.style.display = "block"; // Exibe o container
            } else {
              eleitoresContainer.classList.add("hidden");
              eleitoresContainer.innerHTML = ""; // Limpa o conteúdo se não encontrado
            }
          })
          .catch((error) => {
            document.getElementById("mensagem").innerHTML =
              "RA não encontrado ou incorreto.";
            document.getElementById("mensagem").style.color = "red";
            setTimeout(function () {
              document.getElementById("mensagem").innerHTML = "";
            }, 4000);
          });
      }

      function liberarEleitor(ra) {
        const url = `${BaseUrl}/eleitor/verificar/${ra}`;
        const data = JSON.stringify({
          ra: ra,
        });

        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: data,
        })
          .then((response) => {
            if (!response.ok) {
              // Handle error
            } else {
              document.getElementById("mensagem").innerHTML =
                "Eleitor liberado para votar!";
              document.getElementById("mensagem").style.color = "green";
              document.getElementById("liberarBTN").style.display = "none";
              setTimeout(function () {
                location.href = "id_eleitor.html";
              }, 3000);
            }
            return response.json();
          })
          .catch((error) => {
            if (
              error.name === "TypeError" &&
              error.message === "Failed to fetch"
            ) {
              console.error("Erro de CORS:", error);
              document.getElementById("mensagem").innerHTML =
                "Eleitor já votou! Tente novamente";
              document.getElementById("mensagem").style.color = "red";
              document.getElementById("liberarBTN").style.display = "none";
              setTimeout(function () {
                location.href = "id_eleitor.html";
              }, 3000);
            } else if (error.response && error.response.status === 502) {
              // Handle 502 error
            }
          });
      }
    </script>
  </body>
</html>
