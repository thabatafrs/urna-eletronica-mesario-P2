<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro do Eleitor</title>
    <link rel="stylesheet" href="styleMesario.css" />
    <script
      src="https://kit.fontawesome.com/877e197de7.js"
      crossorigin="anonymous"
    ></script>
    <script src="constantes.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .janela {
        padding: 20px;
        width: 100%;
        max-width: 60%;
        height: 75%;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      h1 {
        text-align: center;
      }

      .input-row {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }

      .input-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #registro-box {
        display: flex;
        flex: 1;
        flex-direction: row;
        gap: 15px;
        justify-content: center;
        margin-top: 15px;
      }

      .registro {
        width: 50%;
        height: 200px;
      }

      label {
        font-weight: bold;
        color: #333;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
        resize: none;
      }

      textarea {
        height: 200px;
      }

      #classe {
        width: 200px;
        /* define um tamanho menor */
        text-align: center;
        margin-bottom: 1px;
      }

      .mensagem {
        text-align: center;
        font-weight: bold;
        font-size: large;
        margin: 10px 0;
      }

      .botoes {
        display: flex;
        justify-content: space-between;
        padding: 15px 0;
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
      }

      #btnMaisRegistro {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 10px;
      }

      
    </style>
  </head>

  <body>
    
    <nav>
      <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
      <div class="nv_est" id="menuItems">
        <a href="hub.html">Home</a>
        <a href="hub_chapas.html">Gerenciador de Candidatos</a>
        <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
        <a href="contagem.html">Contagem de Votos</a>
        <a href="id_eleitor.html">Iniciar Processo</a>
        <a href="index.html">Sair</a>
      </div>
    </nav>
    <div class="janela">
      <h1>Cadastro do Eleitor</h1>
      <div id="divInputs">
        <div class="input-row">
          <div class="input-box">
            <label for="classe">Classe</label>
            <input
              type="text"
              id="classe"
              placeholder="Digite a classe (ex: 5F)"
            />
          </div>
        </div>

        <div class="input-row">
          <div class="input-box">
            <label for="nomes">Nomes (um por linha)</label>
            <textarea
              id="nomes"
              placeholder="Digite um nome por linha"
            ></textarea>
          </div>
          <div class="input-box">
            <label for="numeros">Números (um por linha)</label>
            <textarea
              id="numeros"
              placeholder="Digite um número por linha"
            ></textarea>
          </div>
        </div>
      </div>

      <div id="registro-box" style="display: none">
        <div id="registrosCadastrados" class="registro">
          <h2>Registros Criados</h2>
          <textarea
            id="resultadoCadastrados"
            class="output"
            readonly
          ></textarea>
          <div id="mensagem" class="mensagem" style="color: green">
            Cadastro realizado com sucesso.
          </div>
        </div>
        <div id="registrosNaoCadastrados" class="registro">
          <h2>Registros Não Efetuados</h2>
          <textarea
            id="resultadoNaoCadastrados"
            class="output"
            readonly
          ></textarea>
          <div id="mensagem" class="mensagem" style="color: red">
            Verifique os RAs duplicados!
          </div>
        </div>
      </div>

      <div id="btnMaisRegistro" style="display: none">
        <button
          onclick="adicionarMaisRegistro()"
          class="botao"
          id="adicionarMaisRegistro"
          style="background-color: #ed562d;"

        >
          <i class="fa-solid fa-circle-chevron-left"></i> Voltar para o cadastro
        </button>
      </div>

      <div id="mensagem" class="mensagem"></div>

      <div class="botoes" id="botoes">
        <button onclick="gerarRegistros()" class="botao" id="botaoCadastrar">
          <i class="fa-solid fa-user-plus"></i> Cadastrar
        </button>
        <button
          id="voltarHub"
          class="botao sair"

          onclick="voltarHubEleitores()"
          title="Página anterior"
        >
          <i class="fa-solid fa-circle-chevron-left"></i> Voltar
        </button>
      </div>
    </div>

    <script src="mainMesario.js"></script>
    <script>
      function gerarRegistros() {
        const classe = document.getElementById("classe").value.trim();
        const nomes = document
          .getElementById("nomes")
          .value.split("\n")
          .map((nome) => nome.trim())
          .filter((nome) => nome !== "");
        const numeros = document
          .getElementById("numeros")
          .value.split("\n")
          .map((numero) => numero.trim())
          .filter((numero) => numero !== "");

        if (
          !classe ||
          nomes.length === 0 ||
          numeros.length === 0 ||
          nomes.length !== numeros.length
        ) {
          alert("Preencha todos os campos corretamente.");
          return;
        }

        function formatarNumero(numero) {
          return numero.padStart(2, "0");
        }

        let eleitores = [];
        for (let i = 0; i < nomes.length; i++) {
          const numeroFormatado = formatarNumero(numeros[i]);
          const classeRa = classe + numeroFormatado;
          eleitores.push({ nome: nomes[i], ra: classeRa });
        }

        const myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        const raw = JSON.stringify(eleitores);
        const url = `${BaseUrl}/eleitor`;

        fetch(url, {
          method: "POST",
          headers: myHeaders,
          body: raw,
          redirect: "follow",
        })
          .then((response) => response.json())
          .then((result) => {
            const { eleitoresNaoCadastrados, eleitoresCadastrados } = result;

            // Exibindo eleitores cadastrados e não cadastrados
            document.getElementById("divInputs").style.display = "none";
            document.getElementById("registro-box").style.display = "flex";
            document.getElementById("btnMaisRegistro").style.display = "flex";
            document.getElementById("botoes").style.display = "none";

            let textoCadastrados = "";
            eleitoresCadastrados.forEach((e) => {
              textoCadastrados += `${e.nome} (RA: ${e.ra})\n`;
            });
            document.getElementById("resultadoCadastrados").value =
              textoCadastrados;

            let textoNaoCadastrados = "";
            eleitoresNaoCadastrados.forEach((e) => {
              textoNaoCadastrados += `${e.nome} (RA: ${e.ra})\n`;
            });
            document.getElementById("resultadoNaoCadastrados").value =
              textoNaoCadastrados;

            // Exibir as áreas de registros
            document.getElementById("registrosCadastrados").style.display =
              eleitoresCadastrados.length > 0 ? "block" : "none";
            document.getElementById("registrosNaoCadastrados").style.display =
              eleitoresNaoCadastrados.length > 0 ? "block" : "none";
          })
          .catch((error) => {
            console.error(error);
            alert("Erro ao cadastrar eleitores.");
          });
      }

      function adicionarMaisRegistro() {
        window.location.reload();
      }
    </script>
  </body>
</html>
