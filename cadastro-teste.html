<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro do Eleitor</title>
  <link rel="stylesheet" href="styleMesario.css" />
  <script src="https://kit.fontawesome.com/877e197de7.js" crossorigin="anonymous"></script>
  <script src="constantes.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .janela {
      padding: 20px;
      width: 100%;
      max-width: 60%;
      height: 75%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;

    }

    .input-row {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .input-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1em;
      resize: none;
    }

    textarea {
      height: 200px;
    }

    #classe {
      width: 200px;
      /* define um tamanho menor */
      text-align: center;
      margin-bottom: 1px;
    }

    .mensagem {
      text-align: center;
      font-weight: bold;
      font-size: large;
      color: red;
      margin: 10px 0;
    }

    .botoes {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
    }
  </style>
</head>

<body>
  <div class="janela">
    <h1>Cadastro do Eleitor</h1>
    <div id="divInputs">
      <div class="input-row">
        <div class="input-box">
          <label for="classe">Classe</label>
          <input type="text" id="classe" placeholder="Digite a classe (ex: 5F)" />
        </div>
      </div>

      <div class="input-row">
        <div class="input-box">
          <label for="nomes">Nomes (um por linha)</label>
          <textarea id="nomes" placeholder="Digite um nome por linha"></textarea>
        </div>
        <div class="input-box">
          <label for="numeros">Números (um por linha)</label>
          <textarea id="numeros" placeholder="Digite um número por linha"></textarea>
        </div>
      </div>
    </div>


    <div id="divRegistros" style="display: none">
      <label for="resultado">Registros Gerados</label>
      <textarea id="resultado" class="output" readonly></textarea>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <div class="botoes">
      <button onclick="gerarRegistros()" class="botao">
        <i class="fa-solid fa-user-plus"></i> Cadastrar
      </button>
      <button id="voltarHub" class="botao sair" onclick="voltarHubEleitores()" title="Página anterior">
        <i class="fa-solid fa-circle-chevron-left"></i> Voltar
      </button>
    </div>
  </div>


  <script src="mainMesario.js"></script>
  <script>
    function gerarRegistros() {
      // Pegando os valores dos inputs
      const classe = document.getElementById("classe").value.trim();
      const nomes = document
        .getElementById("nomes")
        .value.split("\n")
        .map((nome) => nome.trim())
        .filter((nome) => nome !== "");
      const numeros = document
        .getElementById("numeros")
        .value.split("\n")
        .map((numero) => numero.trim())
        .filter((numero) => numero !== "");

      // Verificação se os inputs foram preenchidos corretamente
      if (!classe || nomes.length === 0 || numeros.length === 0) {
        document.getElementById(
          "mensagem"
        ).innerHTML = `Preencha todos os campos corretamente.`;
        document.getElementById("mensagem").style.color = "red";
        setTimeout(function () {
          window.location.reload();
        }, 3000);
        return;
      }

      // Verificação se o número de nomes e números é igual
      if (nomes.length !== numeros.length) {
        document.getElementById(
          "mensagem"
        ).innerHTML = `A quantidade de nomes e números deve ser a mesma.`;
        document.getElementById("mensagem").style.color = "red";
        setTimeout(function () {
          window.location.reload();
        }, 3000);
        return;
      }

      // Função para adicionar zero à frente de números de 1 a 9
      function formatarNumero(numero) {
        return numero.padStart(2, "0");
      }

      let registros = "";
      let eleitores = []; // 1. Cria o array para armazenar todos os eleitores

      // 2. Loop para gerar os eleitores
      for (let i = 0; i < nomes.length; i++) {
        var numeroFormatado = formatarNumero(numeros[i]);
        var classeRa = classe + numeroFormatado;
        var nome = nomes[i];
        registros += `${nome} - RA: ${classeRa}\n`;

        // Cria um objeto para cada eleitor e adiciona ao array
        var eleitor = {
          nome: nome,
          ra: classeRa,
        };
        eleitores.push(eleitor); // Armazena o eleitor no array
      }

      document.getElementById("resultado").value = registros;

      // console.log(eleitores);
      // var Eleitores = JSON.stringify(eleitores);
      // console.log(Eleitores);
      // console.log(eleitores);
      const myHeaders = new Headers();
      myHeaders.append("Content-Type", "application/json");

      const raw = JSON.stringify(eleitores);
      // console.log(raw);
      const url = `${BaseUrl}/eleitor`;

      const requestOptions = {
        method: "POST",
        headers: myHeaders,
        // mode: 'no-cors',
        body: raw,
        redirect: "follow",
      };

      fetch(url, requestOptions)
        .then((response) => response.json())
        .then((result) => {
          document.getElementById("divInputs").style.display = 'none'
          document.getElementById("divRegistros").style.display = 'block'
          document.getElementById(
            "mensagem"
          ).innerHTML = `Cadastro realizado com sucesso!`;
          document.getElementById("mensagem").style.color = "green";
          setTimeout(function () {
            window.location.reload();
          }, 5000);

        })
        .catch((error) => {
          console.error(error);
          document.getElementById(
            "mensagem"
          ).innerHTML = `Erro, verifique se há RAs duplicados.`;
          document.getElementById("mensagem").style.color = "red";
        });


      obterMensagemDeErro();
    }

    function obterMensagemDeErro() {
      const url = `${BaseUrl}/eleitor`; // Defina a URL do seu endpoint

      fetch(url)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Erro ao obter a mensagem de erro.");
          }
          return response.text(); // Retorna a resposta como texto
        })
        .then((mensagemErro) => {
          // Atualiza a mensagem na tela
          document.getElementById("mensagem").innerHTML = mensagemErro;
          document.getElementById("mensagem").style.color = "red";
        })
        .catch((error) => {
          console.error(error);
          document.getElementById(
            "mensagem"
          ).innerHTML = `Erro: ${error.message}`;
          document.getElementById("mensagem").style.color = "red";
        });
    }
  </script>
</body>

</html>
