<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contagem de Votos</title>
    <link rel="stylesheet" href="styleMesario.css" />
    <script
      src="https://kit.fontawesome.com/877e197de7.js"
      crossorigin="anonymous"
    ></script>
    <script src="constantes.js"></script>
    <style>
      /* Ajustes do layout geral */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        overflow: hidden;
      }

      .janela.contagem {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90%;
        height: 80%;
        max-width: 600px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      h1 {
        text-align: center;
        color: #333;
        font-size: 1.5rem;
      }

      /* Estilização para a lista de votos */
      #lista-votos {
        list-style: none;
        padding: 0;
        width: 100%;
      }

      /* Estilização para cada cartão de voto */
      #lista-votos li {
        background-color: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 10px 0;
        padding: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
      }

      /* Efeito hover para os cartões */
      #lista-votos li:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      /* Estilização para os títulos dos dados */
      #lista-votos li p {
        margin: 0;
        font-size: 1.1rem;
        color: #444;
      }

      .botoes {
        display: flex;
        justify-content: space-between; /* Espaçamento igual entre os botões */
        align-items: center; /* Alinhamento vertical */
        margin-top: 20px; /* Espaço acima dos botões */
        width: 90%;
      }

      /* .md_es {
        background-color: #292b2c;
        color: #f1f1f1;
      }

      .md_es:hover {
        background-color: #1c1e1f;
      } */
    </style>
  </head>

  <body>
    <nav>
      <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
      <div class="nv_est" id="menuItems">
        <a href="hub.html">Home</a>
        <a href="hub_chapas.html">Gerenciador de Candidatos</a>
        <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
        <a href="contagem.html">Contagem de Votos</a>
        <a href="id_eleitor.html">Iniciar Processo</a>
        <a href="index.html">Sair</a>
      </div>
    </nav>

    <div class="container" id="trap-container">
      <div class="janela contagem">
        <h1>Contagem de Votos</h1>

        <!-- Lista de votos -->
        <ul id="lista-votos"></ul>

        <!-- Botões de controle -->
        <div class="botoes">
          <button
            class="botao zerar"
            onclick="zerarLista()"
            title="Finalizar votação"
          >
            <i class="fa-solid fa-rectangle-xmark"></i> Encerrar Processo
          </button>

          <button
            id="voltarHub"
            class="botao sair"
            onclick="Adm()"
            title="Página anterior"
          >
            <i class="fa-solid fa-circle-chevron-left"></i> Voltar
          </button>

          <button id="md_es" class="md_es" class="botao" onclick="mod_esc()">
            Modo escuro
          </button>
        </div>
      </div>
    </div>

    <script src="mainMesario.js"></script>
    <script>
      function zerarLista() {
        if (
          confirm(
            "Encerrar processo irá apagar todos os dados desta eleição. Deseja prosseguir?"
          )
        ) {
          fetch(`${BaseUrl}/presenca`, {
            method: "DELETE",
          });
          fetch(`${BaseUrl}/voto`, {
            method: "DELETE",
          });
          fetch(`${BaseUrl}/liberacao_urna?isUrnaLiberada=false`, {
            method: "POST",
          })
            .then(() => {
              console.log("Urna zerada com sucesso.");
              window.location.reload();
            })
            .catch((error) => {
              console.error("Erro ao zerar a urna:", error);
            });
        }
      }

      function carregarListaVotos() {
        fetch(`${BaseUrl}/voto`)
          .then((response) => response.json())
          .then((data) => {
            const listaVotos = document.getElementById("lista-votos");
            listaVotos.innerHTML = ""; // Limpa a lista antes de renderizar os novos itens
            console.log(data);

            data.forEach((item) => {
              const li = document.createElement("li");
              li.innerHTML = `
                <p><strong>Nome:</strong> ${item.nome}</p>
                <p><strong>Total de Votos:</strong> ${item.totalVotos}</p>
              `;
              listaVotos.appendChild(li);
            });
          })
          .catch((error) => {
            console.error("Erro ao carregar a lista de votos:", error);
          });
      }

      document.addEventListener("DOMContentLoaded", carregarListaVotos);
    </script>
  </body>
</html>
