<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub dos Candidatos</title>
    <link rel="stylesheet" href="styleMesario.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/877e197de7.js"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Adiciona uma sombra suave */
      .shadow-custom {
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <nav>
      <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
      <div class="nv_est" id="menuItems">
        <a href="hub.html">Home</a>
        <a href="hub_chapas.html">Gerenciador de Candidatos</a>
        <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
        <a href="contagem.html">Contagem de Votos</a>
        <a href="id_eleitor.html">Iniciar Processo</a>
        <a href="index.html">Sair</a>
      </div>
    </nav>

    <div class="container mx-auto p-4">
      <button
        id="md_es"
        class="absolute bottom-8 bg-black text-gray-300 px-5 py-3 rounded-lg font-semibold text-lg"
        onclick="mod_esc()"
      >
        Modo Escuro
      </button>

      <!-- Div principal com sombra e arredondamento -->
      <div
        class="bg-gray-300 rounded-lg shadow-custom p-10 max-w-2xl mx-auto relative"
      >
        <div class="text-center space-y-6">
          <!-- Título e subtítulo da Gestão dos Candidatos -->
          <div class="info">
            <h1 class="text-gray-700 font-bold text-2xl">
              Gestão dos Candidatos
            </h1>
            <h2 class="text-gray-600 font-medium text-lg mt-4">
              Gerencie todas as informações relacionadas às chapas e candidatos
              de forma rápida e simples. Escolha entre cadastrar novas chapas ou
              gerenciar as já existentes.
            </h2>
          </div>

          <!-- Botões principais da Gestão dos Candidatos -->
          <div class="botoes flex flex-col items-center space-y-6 mt-6">
            <button
              onclick="entrarCadastrarChapas()"
              class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold text-lg transition"
              title="Cadastro de Chapa/Candidato"
            >
              Cadastrar nova chapa
            </button>
            <button
              onclick="entrarGerenciadorChapas()"
              class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold text-lg transition"
              title="Listagem de Chapas/Candidatos"
            >
              Exibir todos os candidatos
            </button>
            <!-- Botão Voltar posicionado à direita -->
          </div>
        </div>
        <div class="absolute top-4 right-4">
          <button
            onclick="voltarHub()"
            class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-full text-md font-semibold transition"
            title="Página anterior"
          >
            <i class="fa-solid fa-circle-chevron-left mr-2"></i> Voltar
          </button>
        </div>
      </div>
    </div>

    <script src="mainMesario.js"></script>
  </body>
</html>
