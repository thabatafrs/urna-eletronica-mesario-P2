<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Chapas</title>
  <link rel="stylesheet" href="styleMesario.css" />
  <script src="https://kit.fontawesome.com/877e197de7.js" crossorigin="anonymous"></script>
  <script src="constantes.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
  <nav>
    <i class="fa-solid fa-bars" onclick="toggleMenu()"></i>
    <div class="nv_est" id="menuItems">
      <a href="hub.html">Home</a>
      <a href="hub_chapas.html">Gerenciador de Candidatos</a>
      <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
      <a href="contagem.html">Contagem de Votos</a>
      <a href="id_eleitor.html">Iniciar Processo</a>
      <a href="index.html">Sair</a>
    </div>
  </nav>
  <div class="container mx-auto p-4 w-full max-w-2xl">
    <button id="md_es" class="absolute bottom-4 bg-black text-gray-300 px-5 py-3 rounded-lg font-semibold text-lg"
      onclick="toggleTheme()">
      Modo Escuro
    </button>
    <div class="bg-gray-300 rounded-lg shadow-lg p-12 relative">
      <h1 class="text-gray-800 font-bold text-2xl mb-4 text-center">Cadastro de Candidatos</h1>

      <div class="absolute top-4 right-4">
        <button onclick="voltarHubChapas()"
          class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-full text-md font-semibold transition"
          title="Página anterior">
          <i class="fa-solid fa-circle-chevron-left mr-2"></i> Voltar
        </button>
      </div>

      <form class="flex flex-col space-y-4" id="cadastroForm">
        <label class="flex flex-col">
          <span class="text-gray-600">Número da chapa:</span>
          <div class="flex items-center">
            <i class="fa-solid fa-server mr-2 text-gray-700"></i>
            <input type="number" min="1" id="chapa" placeholder="Digite o número" name="chapa" required maxlength="2"
              class="mt-1 p-2 border rounded w-full text-gray-700" />
          </div>
        </label>

        <label class="flex flex-col">
          <span class="text-gray-600">Nome do candidato:</span>
          <div class="flex items-center">
            <i class="fa-solid fa-user mr-2 text-gray-700"></i>
            <input type="text" id="nome" placeholder="Digite o nome" name="nome" required
              class="mt-1 p-2 border rounded w-full text-gray-700" />
          </div>
        </label>

        <label class="flex flex-col">
          <span class="text-gray-600">Foto do candidato:</span>
          <div class="flex items-center">
            <i class="fa-solid fa-image mr-2 text-gray-700"></i>
            <input type="file" id="foto" name="foto" accept="image/*" required onchange="previewImage()"
              class="mt-1 p-2 border rounded w-full text-gray-700" />
            <img id="preview" src="#" alt="Preview da imagem" class="w-24 h-24 rounded ml-4 hidden" />
          </div>
        </label>

        <span class="text-red-500 text-center" id="mensagem"></span>

        <button type="submit"
          class="bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-semibold transition" id="cadastro"
          title="Realizar Cadastro">
          <i class="fa-solid fa-user-plus"></i> Cadastrar
        </button>
      </form>
    </div>
  </div>

  <script src="mainMesario.js"></script>
  <script>
    function previewImage() {
      const preview = document.getElementById("preview");
      const file = document.getElementById("foto").files[0];
      const reader = new FileReader();

      reader.onloadend = function () {
        preview.src = reader.result;
        preview.style.display = "block";
      };

      if (file) {
        reader.readAsDataURL(file);
      } else {
        preview.src = "";
        preview.style.display = "none";
      }
    }

    document.getElementById("chapa").addEventListener("input", function () {
      if (this.value.length > 2) {
        this.value = this.value.slice(0, 2);
      }
    });

    document
      .getElementById("cadastroForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(this);
        const reader = new FileReader();
        const json = {};

        reader.onload = function () {
          const base64Image = reader.result.split(",")[1];
          json["foto"] = base64Image;
          formData.forEach(function (value, key) {
            if (key !== "foto") {
              json[key] = value;
            }
          });

          fetch(`${BaseUrl}/candidato`, {
              method: "POST",
              body: JSON.stringify(json),
              headers: {
                "Content-Type": "application/json",
              },
            })
            .then((response) => response.json())
            .then((data) => {
              const cadastro = data.chapa;

              if (typeof cadastro != "undefined") {
                document.getElementById("mensagem").innerHTML = `Cadastro bem sucedido.`;
                document.getElementById("mensagem").style.color = "green";

                setTimeout(function () {
                  window.location.href = "cadastroChapas.html";
                }, 3000);
              } else {
                document.getElementById("mensagem").innerHTML = `Chapa já cadastrada.`;
                setTimeout(function () {
                  window.location.href = "cadastroChapas.html";
                }, 3000);
              }
            })
            .catch((error) => {
              console.error("Erro:", error);
              alert("Falha ao Cadastrar");
              window.location.reload();
            });
        };

        reader.readAsDataURL(this.querySelector('input[type="file"]').files[0]);
      });
  </script>
</body>

</html>
