<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogIn da Urna</title>
  <script src="https://kit.fontawesome.com/877e197de7.js" crossorigin="anonymous"></script>
  <script src="constantes.js"></script>
  <link rel="stylesheet" href="styleMesario.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .shadow-custom {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">
  <nav class="flex items-center justify-between mb-4">
    <i class="fa-solid fa-bars cursor-pointer" onclick="toggleMenu()"></i>
    <div class="nv_est" id="menuItems">
      <a href="hub.html">Home</a>
      <a href="hub_chapas.html">Gerenciador de Candidatos</a>
      <a href="hub_eleitor.html">Gerenciador de Eleitores</a>
      <a href="contagem.html">Contagem de Votos</a>
      <a href="id_eleitor.html">Iniciar Processo</a>
      <a href="index.html">Sair</a>
    </div>
  </nav>

  <div class="container mx-auto p-4">
    <button id="md_es" class="absolute bottom-4 bg-black text-gray-300 px-5 py-3 rounded-lg font-semibold text-lg"
      onclick="toggleTheme()">
      Modo Escuro
    </button>

    <div
      class="bg-gray-300 rounded-lg shadow-custom form-container flex flex-col items-center justify-center p-8 w-full max-w-lg">
      <!-- Aumentei o padding e defini largura máxima -->
      <h1 class="text-gray-700 font-bold text-2xl text-center mb-4">
        Trocar Senha
      </h1>

      <div class="w-full flex flex-col mb-4 space-y-4">
        <label class="flex items-center w-full">
          <i class="fa-solid fa-user mr-2 text-gray-700"></i>
          <select name="tip_urs" required id="tip_urs" class="mt-1 w-full p-2 border rounded text-gray-700">
            <option value="null" disabled selected>
              Selecione o tipo de usuário
            </option>
            <option value="Mesario">Mesário</option>
            <option value="Administrador">Administrador</option>
          </select>
        </label>

        <label class="flex items-center mb-4">
          <i class="fa-solid fa-lock mr-2 text-gray-700"></i>
          <input type="password" name="senha_alt" min="1" maxlength="6" id="senha_alt" placeholder="Digite a nova senha"
            pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required
            class="mt-1 w-full p-2 border rounded text-gray-700" />
        </label>

        <label class="flex items-center mb-4" for="senha_conf">
          <i class="fa-solid fa-lock mr-2 text-gray-700"></i>
          <input type="password" name="senha_conf" min="1" maxlength="6" id="senha_conf"
            placeholder="Repita a nova senha" pattern="[0-9]*" inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, '');" required
            class="text-gray-700 mt-1 w-full p-2 border rounded" />
        </label>

        <span id="error-message" class="error-message text-center text-red-500"></span>
      </div>

      <div class="flex justify-between w-full mt-4">
        <button
          class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg font-semibold text-lg transition w-1/2 mr-2"
          id="salvar" onclick="verificarSenhas()" title="salvar">
          <i class="fa-solid fa-floppy-disk"></i> Salvar
        </button>

        <button id="voltarHub"
          class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg font-semibold text-lg transition w-1/2"
          onclick="Adm()" title="Página anterior">
          <i class="fa-solid fa-circle-chevron-left"></i> Voltar
        </button>
      </div>
    </div>
  </div>

  <script>
    function verificarSenhas() {
      const tipoUsuario = document.getElementById("tip_urs").value;
      const senha = document.getElementById("senha_alt").value;
      const confirmarSenha = document.getElementById("senha_conf").value;
      const errorMessage = document.getElementById("error-message");

      if (tipoUsuario === "null") {
        errorMessage.textContent = "Por favor, selecione um tipo de usuário.";
        return false;
      }

      if (!senha || !confirmarSenha) {
        errorMessage.textContent =
          "Por favor, preencha ambos os campos de senha.";
        return false;
      }

      if (senha !== confirmarSenha) {
        errorMessage.textContent =
          "As senhas não coincidem. Tente novamente.";
        return false;
      } else {
        errorMessage.textContent = "";
        alert("Senha alterada com sucesso!");
      }
    }
  </script>
  <script src="mainMesario.js"></script>
</body>

</html>
